[project]
name = "seam_engine"
version = "0.1.0"
description = "MCP Server created with Arcade.dev"
requires-python = ">=3.10"
dependencies = [
    "arcade-mcp-server>=1.17.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "arcade-mcp[all]>=1.15.0,<2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
# `mypy`/`pytest`/`ruff` live only in this group, never in the base
# `dependencies` above. `uv run pytest` on a `.venv` that has never synced
# `dev` fails loudly (`No module named pytest`, CONTRIBUTING.md's own PR
# checklist names this). `uv run mypy` does NOT fail loudly in that same
# state -- it silently falls back to any `mypy` already on `$PATH` and
# prints a plausible strict-check result for a completely different,
# unpinned version, with no warning. Confirmed live (task 660): a fresh
# container's global `mypy 1.19.1` reported 7 false "errors" in
# `server.py` that this project's real, locked `mypy` (`uv.lock` pins
# 2.2.0) does not produce. Always run `uv run --extra dev mypy --strict
# src` (or `uv sync --extra dev` first) -- never a bare `uv run mypy`.

# Tell Arcade.dev that this package has Arcade tools
[project.entry-points.arcade_toolkits]
toolkit_name = "seam_engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seam_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false

# httpx and arcade_mcp_server both ship a `py.typed` marker and ARE typed --
# mypy just can't resolve them here because `uv run mypy` (no
# --python-executable) doesn't search this project's own .venv/site-packages
# by default. Silencing the import-not-found noise (not vendoring stubs, not
# touching either library) so a real `--strict` run's signal isn't buried
# under two false "missing" imports.
[[tool.mypy.overrides]]
module = ["httpx", "arcade_mcp_server", "arcade_mcp_server.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
