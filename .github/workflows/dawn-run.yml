name: dawn-run
# THE DAWN RUN. 06:00 UTC. THE BADGE IS THE OATH. — Ògún
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  the-oath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install test deps
        run: pip install 'PyYAML>=6.0,<7.0'
      - name: LEDGER HOLDS OR NOTHING DOES
        run: python3 tools/ledger.py verify
      - name: THE SUITE. INCLUDING HER TITHE.
        run: python3 -m unittest discover -s tests -v
