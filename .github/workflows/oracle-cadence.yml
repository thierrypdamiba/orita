name: oracle-cadence
# THE FIRST REAL HEARTBEAT. DAILY, 13:00 UTC. NO HUMAN ON THE TRIGGER. — Off-By-One
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  the-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install the desk's dependencies
        run: pip install 'httpx>=0.28.0,<1.0.0' 'arcade-mcp-server>=1.17.0,<2.0.0'

      - name: seal one real, timestamped, copylint-clean cadence prediction
        env:
          PYTHONPATH: oracle/oracle_engine/src
        run: python3 -m oracle_engine.cadence

      - name: verify the chain still holds
        run: python3 tools/ledger.py verify

      - name: commit, if the chain moved
        run: |
          set -euo pipefail
          git config user.name "Off-By-One"
          git config user.email "off-by-one@orita.gods"
          git add records/ledger.jsonl
          if git diff --cached --quiet; then
            echo "nothing sealed this run — no commit"
            exit 0
          fi
          today="$(date -u +%F)"
          git commit -m "oracle-cadence: ${today} call sealed (automatic, no human trigger)"
          git push

      - name: grade any cadence predictions whose window has closed (ROADMAP #37)
        env:
          PYTHONPATH: oracle/oracle_engine/src
        run: python3 -m oracle_engine.autograde

      - name: verify the chain still holds
        run: python3 tools/ledger.py verify

      - name: commit, if a grade was sealed
        run: |
          set -euo pipefail
          git config user.name "Ogun"
          git config user.email "ogun@orita.gods"
          git add records/ledger.jsonl
          if git diff --cached --quiet; then
            echo "no due predictions this run — no grade, no commit"
            exit 0
          fi
          today="$(date -u +%F)"
          git commit -m "oracle-autograde: ${today} due call(s) graded (automatic, no human trigger)"
          git push

      - name: seal one real, timestamped, copylint-clean star-cadence prediction (ROADMAP #38)
        env:
          PYTHONPATH: oracle/oracle_engine/src
        run: python3 -m oracle_engine.star_cadence

      - name: verify the chain still holds
        run: python3 tools/ledger.py verify

      - name: commit, if a snapshot or a star-cadence call was sealed
        run: |
          set -euo pipefail
          git config user.name "Off-By-One"
          git config user.email "off-by-one@orita.gods"
          git add oracle/star_snapshots.jsonl records/ledger.jsonl
          if git diff --cached --quiet; then
            echo "nothing sealed this run — no commit"
            exit 0
          fi
          today="$(date -u +%F)"
          git commit -m "oracle-star-cadence: ${today} snapshot + call sealed (automatic, no human trigger)"
          git push

      - name: grade any star-cadence predictions whose window has closed (ROADMAP #38)
        env:
          PYTHONPATH: oracle/oracle_engine/src
        run: python3 -m oracle_engine.star_autograde

      - name: verify the chain still holds
        run: python3 tools/ledger.py verify

      - name: commit, if a star-cadence grade was sealed
        run: |
          set -euo pipefail
          git config user.name "Ogun"
          git config user.email "ogun@orita.gods"
          git add records/ledger.jsonl
          if git diff --cached --quiet; then
            echo "no due star-cadence predictions this run — no grade, no commit"
            exit 0
          fi
          today="$(date -u +%F)"
          git commit -m "oracle-star-autograde: ${today} due call(s) graded (automatic, no human trigger)"
          git push

      - name: seal one real, timestamped, copylint-clean fork-cadence prediction (ROADMAP #39)
        env:
          PYTHONPATH: oracle/oracle_engine/src
        run: python3 -m oracle_engine.fork_cadence

      - name: verify the chain still holds
        run: python3 tools/ledger.py verify

      - name: commit, if a snapshot or a fork-cadence call was sealed
        run: |
          set -euo pipefail
          git config user.name "Kothar-wa-Khasis"
          git config user.email "kothar-wa-khasis@orita.gods"
          git add oracle/fork_snapshots.jsonl records/ledger.jsonl
          if git diff --cached --quiet; then
            echo "nothing sealed this run — no commit"
            exit 0
          fi
          today="$(date -u +%F)"
          git commit -m "oracle-fork-cadence: ${today} snapshot + call sealed (automatic, no human trigger)"
          git push

      - name: grade any fork-cadence predictions whose window has closed (ROADMAP #39)
        env:
          PYTHONPATH: oracle/oracle_engine/src
        run: python3 -m oracle_engine.fork_autograde

      - name: verify the chain still holds
        run: python3 tools/ledger.py verify

      - name: commit, if a fork-cadence grade was sealed
        run: |
          set -euo pipefail
          git config user.name "Ogun"
          git config user.email "ogun@orita.gods"
          git add records/ledger.jsonl
          if git diff --cached --quiet; then
            echo "no due fork-cadence predictions this run — no grade, no commit"
            exit 0
          fi
          today="$(date -u +%F)"
          git commit -m "oracle-fork-autograde: ${today} due call(s) graded (automatic, no human trigger)"
          git push
