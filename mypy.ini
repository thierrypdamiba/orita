# `tools/` has no `pyproject.toml`/venv of its own -- it runs on whatever
# plain `python3`/`mypy` sit on $PATH (task 644/646 confirmed this live:
# root-suite tests import `tools/*.py` with a bare `python3 -m unittest
# discover`, no `uv run`). Several `tools/*_check.py` files (ritual_check,
# recipe_readme_check, badge_freshness_check, gap_true_positive_check,
# recipe_command_check, site_recipe_check, consent_grant_log) dynamically
# import `seam_engine` (via `sys.path.insert`, `fencepost/seam_engine/src`)
# for live cross-checks against the Fencepost side.
#
# Without this file, `mypy --strict tools/` cannot resolve those imports at
# all -- not because the code is wrong, but because a bare `mypy` (this
# container's own `uv tool install`-managed global, isolated from every
# project's `.venv`) never sees `fencepost/seam_engine/src` on its search
# path. Task 644 first closed this by manually installing `seam_engine`
# into that global tool's own isolated venv; that fix lived only in the
# container, never in the repo, so every fresh container (task 646, and
# again this hour, task 661) rediscovered the same false
# "Cannot find implementation or library stub for module named
# 'seam_engine'" errors from a clean checkout and had to re-solve it by
# hand. `mypy_path` below makes resolution durable and repo-local instead:
# mypy auto-discovers this file from the repo root with no extra flags,
# so a bare `mypy --strict tools/` (or `mypy tools/`) just works on any
# fresh container, no per-session tool-venv surgery required.
#
# `follow_imports = silent` + `ignore_missing_imports` on the two package
# globs matters just as much: without it, mypy does not just resolve the
# module names, it walks into `fencepost/seam_engine/src/seam_engine/*.py`
# and `oracle/oracle_engine/src/oracle_engine/*.py` as first-class checked
# files, which then fail on THEIR OWN runtime-only imports (`httpx`,
# `arcade_mcp_server`) that live only in each project's own `.venv`, never
# in this global tool's venv either. Those two source trees already carry
# their own `--strict` sweep, correctly invoked from inside each project
# (`uv run --extra dev mypy --strict src` -- see the doctrine comment in
# `fencepost/seam_engine/pyproject.toml` / `oracle/oracle_engine/pyproject.toml`
# next to `[tool.mypy]`); `tools/`'s own check only needs their public
# names resolved, not a second, wrongly-invoked re-check of their bodies.
#
# Verified live (task 661, 2026-08-10): `mypy --strict tools/` reads
# "Success: no issues found in 69 source files" from a fresh checkout with
# this file in place, and does not change either project's own `--strict`
# result (both re-run clean from their own directories, unaffected --
# mypy resolves config files from the current working directory only, so
# `cd fencepost/seam_engine && uv run --extra dev mypy --strict src` still
# finds that project's own `pyproject.toml`, never this file).
[mypy]
mypy_path = fencepost/seam_engine/src:oracle/oracle_engine/src

[mypy-seam_engine.*]
follow_imports = silent
ignore_missing_imports = True

[mypy-oracle_engine.*]
follow_imports = silent
ignore_missing_imports = True
